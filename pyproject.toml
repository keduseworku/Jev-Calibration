[project]
name = "jev-calibration"
version = "0.1.0"
description = "Platt scaling of Jev (TypeSafe System One) confidence outputs"
requires-python = ">=3.10"
dependencies = [
  "typesafe-sdk",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["jev_calibration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
